<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="progress-circle">
        <div class="countdown-container">
            <h1>Time Left:</h1>
            <div id="countdown">
                <div class="time">
                    <span id="days"></span>Days
                </div>
                <div class="time">
                    <span id="hours"></span>Hrs
                </div>
                <div class="time">
                    <span id="minutes"></span>Min
                </div>
                <div class="time">
                    <span id="seconds"></span>Sec
                </div>
            </div>
        </div>
    </div>

    <label for="date-select">Choose a countdown date:</label>
    <select id="date-select">
        <option value="Mar 20, 2025 8:00:00">March 20, 2025</option>
        <option value="Dec 29, 2024 12:00:00">December 25, 2024</option>
        <option value="Jan 15, 2025 00:00:00">January 1, 2025</option>
    </select>

    <script src="script.js"></script>
</body>

</html>
